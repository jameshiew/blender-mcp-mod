[package]
name = "blender-mcp"
version = "1.9.1+mod"
edition = "2024"
description = "Blender integration through the Model Context Protocol"
license = "MIT"
repository = "https://github.com/jameshiew/blender-mcp-mod"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
jsonschema = { version = "0.54.0", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem"] }
regex = "1.13.1"
rmcp = { version = "3.2.0", default-features = false, features = ["server", "transport-io"] }
rustls-rustcrypto = { git = "https://github.com/RustCrypto/rustls-rustcrypto.git", rev = "70f76c039e587192688af18a80d5d6435dedaf22", version = "0.0.2-alpha", default-features = false, features = ["std", "zeroize"] }
rustpython-parser = { version = "0.4.0", default-features = false, features = ["num-bigint"] }
semver = "1.0.28"
serde_json = "1.0.151"
sha2 = { version = "0.11", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "sync", "time", "signal", "fs"] }
tokio-rustls = { version = "0.26.5", default-features = false }
url = "2.5.8"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.4", features = ["process"] }
