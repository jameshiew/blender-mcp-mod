[project]
name = "blender-mcp-addon-tests"
dynamic = ["version"]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "Cargo.toml"
pattern = '(?m)^version = "(?P<version>[^"]+)"$'

[tool.uv]
package = false
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[dependency-groups]
addon = [
    "requests>=2.34.2",
]
dev = [
    { include-group = "addon" },
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
