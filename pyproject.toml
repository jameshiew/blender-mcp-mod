[project]
name = "blender-mcp-addon-tests"
dynamic = ["version"]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "Cargo.toml"
pattern = '(?m)^version = "(?P<version>[^"]+)"$'

[tool.uv]
package = false
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"
python-platform = "all"

[tool.ty.src]
include = ["extension", "tests", "tools"]

[tool.ty.rules]
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
invalid-argument-type = "error"
unused-ignore-comment = "error"
ignore-comment-unknown-rule = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ruff.lint]
extend-select = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[dependency-groups]
addon = [
    "requests>=2.34.2",
]
dev = [
    { include-group = "addon" },
    "fake-bpy-module-5-2>=20260730",
    "numpy>=2.4.6",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "ty>=0.0.83",
    "types-requests>=2.33.0.20260906",
]
